<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Política de segurança de conteúdo: só o próprio site e o Google
         Analytics (carregado após o aceite dos cookies). O JSON-LD inline não
         executa, então não é bloqueado. Em desenvolvimento esta meta é
         removida pelo Vite (ver vite.config.js). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!--app-head-->
    <meta name="theme-color" content="#3C14E4" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--app-preload-->

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="IFVET Patologia Diagnóstica" />
    <meta property="og:image" content="https://www.ifvet.com.br/assets/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logotipo do IFVET Patologia Diagnóstica sobre foto de microscópio em tom roxo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.ifvet.com.br/assets/og-image.jpg" />
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
  </body>
</html>
